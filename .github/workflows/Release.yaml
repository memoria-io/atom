name: Release

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'README.md'

# Never run two releases at once, and never cancel one halfway through a deploy.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write   # create the version tag
  packages: write   # publish, and read the parent POM from GitHub Packages

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Sonar needs full history for blame / new-code detection

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          cache: maven # replaces the manual actions/cache step
          server-id: github
          server-username-env-var: GITHUB_ACTOR
          server-password-env-var: GITHUB_TOKEN

      - name: Verify and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B -Pjacoco verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=ismailmarmoush
          -Dsonar.projectKey=ismailmarmoush_java-kit

      - name: Read project version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish package
        run: mvn -B -Ppublish deploy -DskipTests # tests already ran in verify

      - name: Create tag
        if: ${{ !endsWith(env.VERSION, '-SNAPSHOT') }}
        run: >
          gh api "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/$VERSION"
          -f sha="$GITHUB_SHA"